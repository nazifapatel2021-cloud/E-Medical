name: e_medical_app
description: "E-Medical — Your Personal Health Companion"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.1
  easy_localization: ^3.0.5
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.1.2
  supabase_flutter: ^2.5.6
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/data/
    - logo.jpg
